name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: TypeCheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Run TypeScript Verification
        run: |
          cd app
          npx tsc --noEmit

      - name: Verify Web Assets Rendering
        run: |
          test -f app/public/index.html
          test -f app/public/buy.html
          test -f app/public/sell.html
          test -f app/public/relocate.html
          test -f app/public/speaking.html
          echo "All web assets verified."
